name: mac bigio diag

on:
  workflow_dispatch:

jobs:
  bigio:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: develop-ts
            ref: develop
            ts: "ON"
          - name: develop-nots
            ref: develop
            ts: "OFF"
          - name: presplit-ts
            ref: 748365323007c4331bcdeaaef1861cbcd4265f5d
            ts: "ON"
          - name: presplit-nots
            ref: 748365323007c4331bcdeaaef1861cbcd4265f5d
            ts: "OFF"
    name: ${{ matrix.name }}
    steps:
      - name: brew
        run: brew install openmpi
      - name: h5
        uses: actions/checkout@v5
        with:
          repository: hyoklee/hdf5
          ref: ${{ matrix.ref }}
      - name: build
        run: |
          mkdir build
          cd build
          cmake \
          -G Ninja \
          -DBUILD_SHARED_LIBS=ON \
          -DCMAKE_TOOLCHAIN_FILE=config/toolchain/clang.cmake \
          -DHDF5_ALLOW_UNSUPPORTED=ON \
          -DHDF5_BUILD_HL_LIB:BOOL=OFF \
          -DHDF5_BUILD_TOOLS:BOOL=OFF \
          -DHDF5_BUILD_UTILS:BOOL=OFF \
          -DHDF5_BUILD_EXAMPLES:BOOL=OFF \
          -DHDF5_ENABLE_PARALLEL:BOOL=ON \
          -DHDF5_ENABLE_THREADSAFE:BOOL=${{ matrix.ts }} \
          -DMPIEXEC_MAX_NUMPROCS:STRING=3 \
          ..
          ninja t_bigio
          sysctl hw.ncpu hw.memsize
          df -h .
      - name: np3 ompio
        timeout-minutes: 12
        run: |
          cd build/bin
          time mpirun -np 3 ./t_bigio
      - name: np3 romio
        if: always()
        timeout-minutes: 12
        run: |
          cd build/bin
          rm -f *.h5
          time mpirun -np 3 --mca io romio341 ./t_bigio
      - name: np2 ompio
        if: always()
        timeout-minutes: 12
        run: |
          cd build/bin
          rm -f *.h5
          time mpirun -np 2 ./t_bigio
