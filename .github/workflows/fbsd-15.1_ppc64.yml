name: fbsd-15.1 ppc64

# Manual runs only: emulated powerpc64 can't finish in the 6 h job limit
# (the first run was still building cmake from source when it timed out).
on:
  workflow_dispatch:

jobs:
  test:
    name: fbsd-15.1 powerpc64
    # vmactions emulates big-endian powerpc64 (pseries, power9) with qemu on
    # the x86_64 runner, so it is slow.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: h5
        uses: actions/checkout@v6
        with:
          repository: HDFGroup/hdf5
          ref: filter-config/03-class3

      # Each run starts from a fresh checkout in a fresh VM, so ccache (which
      # hashes contents) is what avoids recompiling unchanged sources.
      # Restore after the checkout, which would otherwise wipe .ccache.
      - name: restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-fbsd-15.1-powerpc64-${{ github.run_id }}
          restore-keys: ccache-fbsd-15.1-powerpc64-

      - name: test
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          arch: powerpc64
          # powerpc64 defaults to an nfs mount of the workspace; copy it to the
          # VM's own disk instead (faster builds) and copy back for .ccache.
          sync: tar
          copyback: true
          # pkg.FreeBSD.org builds no ports packages for powerpc64 (only base
          # and kmods), so build cmake, libaec and ccache from source. That
          # is slow under emulation; the VM image is cached after prepare so
          # later runs skip it.
          cache-after-prepare: true
          prepare: |
            set -e
            cd /tmp
            get() {
              fetch -q -o "$2" "$1"
              [ "$(sha256 -q "$2")" = "$3" ]
              tar xzf "$2"
            }
            get https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6.tar.gz \
              cmake.tgz 653427f0f5014750aafff22727fb2aa60c6c732ca91808cfb78ce22ddd9e55f0
            (cd cmake-3.31.6 &&
              ./bootstrap --prefix=/usr/local --parallel=2 --no-qt-gui -- \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_USE_OPENSSL=ON &&
              make -j2 && make install)
            get https://github.com/MathisRosenhauer/libaec/releases/download/v1.1.4/libaec-1.1.4.tar.gz \
              libaec.tgz 1b9f3b913d9111469a83820ab62bb6a9f3ec7a5f9b6d681761776aecbc7fefbe
            (cmake -S libaec-1.1.4 -B libaec-build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr/local &&
              cmake --build libaec-build -j2 && cmake --install libaec-build)
            get https://github.com/ccache/ccache/releases/download/v3.7.12/ccache-3.7.12.tar.gz \
              ccache.tgz d2abe88d4c283ce960e233583061127b156ffb027c6da3cf10770fc0c7244194
            (cd ccache-3.7.12 && ./configure --prefix=/usr/local && make -j2 && make install)
            rm -rf /tmp/cmake* /tmp/libaec* /tmp/ccache*
            cmake --version
          run: |
            cc --version
            export CCACHE_DIR="$PWD/.ccache" CCACHE_BASEDIR="$PWD"
            export CCACHE_MAXSIZE=1G CMAKE_BUILD_PARALLEL_LEVEL=2
            ccache -z
            mkdir build
            cd build
            cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
              -DCTEST_DROP_LOCATION_INIT:STRING="/submit.php?project=HDF5" \
              -DHDF5_ENABLE_ZLIB_SUPPORT:BOOL=ON \
              -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=ON \
              -DSITE:STRING="fbsd-15.1.powerpc64" \
              -DBUILDNAME:STRING="pr6699/sz/zl" \
              ..
            # HDF5's CTestConfig.cmake FORCEs DART_TESTING_TIMEOUT to 1200, so
            # double it with --timeout (tests with their own TIMEOUT keep it).
            # Capture the rc so a test failure doesn't skip the copyback.
            rc=0
            ctest -D Experimental -C Release -j2 --timeout 2400 || rc=$?
            echo $rc > ../ctest.rc
            cd ..
            ccache -s
            # Keep copyback small: only .ccache and ctest.rc need to come out.
            rm -rf build
            exit 0

      # Save even when tests fail; the compiled objects are still valid.
      - name: save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-fbsd-15.1-powerpc64-${{ github.run_id }}

      - name: check ctest result
        run: exit "$(cat ctest.rc)"
