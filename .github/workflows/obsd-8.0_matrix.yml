name: obsd-8.0 matrix

on:
  workflow_dispatch:
  push:
    branches: main

jobs:
  test:
    name: obsd-8.0 ${{ matrix.arch }}
    # vmactions runs every arch on the plain x86_64 runner; aarch64,
    # riscv64 and sparc64 are emulated with qemu, so they are slow.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, riscv64, sparc64]
    steps:
      - name: h5
        uses: actions/checkout@v6
        with:
          repository: hyoklee/hdf5

      # Every run starts from a fresh checkout in a fresh VM, so make's
      # timestamps can't skip anything (ctest -D Continuous wouldn't help).
      # ccache hashes file contents instead, so only sources that changed
      # since the last run are recompiled.  Restore after the checkout,
      # which would otherwise wipe .ccache.
      - name: restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-obsd-8.0-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-obsd-8.0-${{ matrix.arch }}-

      - name: test
        uses: vmactions/openbsd-vm@v1
        with:
          release: "8.0"
          arch: ${{ matrix.arch }}
          # Copy the workspace back so the updated .ccache can be saved.
          copyback: true
          # Cache the VM image after pkg_add so re-runs on the emulated
          # architectures skip the slow package install.
          cache-after-prepare: true
          prepare: |
            pkg_add cmake ccache
          run: |
            cc --version
            export CCACHE_DIR="$PWD/.ccache" CCACHE_BASEDIR="$PWD"
            export CCACHE_MAXSIZE=1G MAKEFLAGS=-j2
            ccache -z
            mkdir build
            cd build
            cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
              -DCTEST_DROP_LOCATION_INIT:STRING="/submit.php?project=HDF5" \
              -DSITE:STRING="obsd-8.0" \
              -DBUILDNAME:STRING="hk/${{ matrix.arch }}/develop" \
              ..
            # HDF5's CTestConfig.cmake FORCEs DART_TESTING_TIMEOUT to 1200, so
            # double it with --timeout (tests with their own TIMEOUT keep it).
            # The script runs under sh -e; capture the rc so a test failure
            # doesn't skip the copyback of .ccache.
            rc=0
            ctest -D Experimental -C Release -j2 --timeout 2400 || rc=$?
            echo $rc > ../ctest.rc
            cd ..
            ccache -s
            # Keep copyback small: only .ccache and ctest.rc need to come out.
            rm -rf build
            exit 0

      # Save even when tests fail; the compiled objects are still valid.
      - name: save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-obsd-8.0-${{ matrix.arch }}-${{ github.run_id }}

      - name: check ctest result
        run: exit "$(cat ctest.rc)"
