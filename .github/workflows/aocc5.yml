name: lin aocc-5.2.0 ompi-5.0.7

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          repository: HDFGroup/hdf5
      - name: install
        run: |
          sudo apt update
          sudo apt install -y libaec-dev zlib1g-dev automake autoconf libcurl4-openssl-dev libjpeg-dev wget curl bzip2 m4 flex bison cmake libzip-dev doxygen openssl libtool libtool-bin build-essential libncurses-dev libquadmath0 libstdc++6 libxml2-16
      - name: aocc
        run: |
          wget https://download.amd.com/developer/eula/aocc/aocc-5-2/aocc-compiler-5.2.0.tar
          tar -xvf aocc-compiler-5.2.0.tar
          cd aocc-compiler-5.2.0
          bash install.sh
          source /home/runner/work/actions/actions/setenv_AOCC.sh
          # Ubuntu 26.04 ships only libxml2.so.16 (libxml2-16); AOCC's prebuilt LLVM may link libxml2.so.2
          if ldd /home/runner/work/actions/actions/aocc-compiler-5.2.0/bin/clang | grep -q "libxml2.so.2 => not found"; then
            sudo ln -s /usr/lib/x86_64-linux-gnu/libxml2.so.16 /usr/lib/x86_64-linux-gnu/libxml2.so.2
          fi
          which clang
          which flang
          clang -v
      - name: ompi
        run: |
          export LD_LIBRARY_PATH=/home/runner/work/actions/actions/aocc-compiler-5.2.0/lib:/usr/local/lib
          wget https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.7.tar.gz
          tar zxvf openmpi-5.0.7.tar.gz
          cd openmpi-5.0.7
          ./configure CC=/home/runner/work/actions/actions/aocc-compiler-5.2.0/bin/clang FC=/home/runner/work/actions/actions/aocc-compiler-5.2.0/bin/flang --prefix=/usr/local
          make
          sudo make install
      - name: hdf5
        env:
          NPROCS: 2
        run: |
          export LD_LIBRARY_PATH=/home/runner/work/actions/actions/aocc-compiler-5.2.0/lib:/usr/local/lib/openmpi:/usr/local/lib
          export LD_RUN_PATH=/home/runner/work/actions/actions/aocc-compiler-5.2.0/lib:/usr/local/lib/openmpi:/usr/local/lib          
          export PATH=/usr/local/bin:$PATH
          export CC=/usr/local/bin/mpicc
          export LDFLAGS="-L/home/runner/work/actions/actions/aocc-compiler-5.2.0/lib -L/usr/local/lib/openmpi"          
          mkdir build
          cd build
          cmake ..
          ctest -T Build
          ctest -T Test
